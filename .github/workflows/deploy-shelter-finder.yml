name: Deploy Resource Finder

on:
  push:
    branches:
      - main
    paths:
      - 'shelter-finder/**'
      - '.github/workflows/deploy-shelter-finder.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: shelter-finder/package-lock.json
      
      - name: Install dependencies
        working-directory: ./shelter-finder
        run: npm ci
      
      - name: Build
        working-directory: ./shelter-finder
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./shelter-finder/dist
          destination_dir: ./shelter-finder

